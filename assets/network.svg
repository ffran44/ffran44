<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" font-family="'Fira Code', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#132235"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- links -->
    <path id="l-inet" d="M420 48 L420 110"/>
    <path id="l-sw1" d="M420 110 L220 170"/>
    <path id="l-sw2" d="M420 110 L620 170"/>
    <path id="l-pc1" d="M220 170 L110 235"/>
    <path id="l-pc2" d="M220 170 L220 235"/>
    <path id="l-pc3" d="M220 170 L330 235"/>
    <path id="l-pc4" d="M620 170 L510 235"/>
    <path id="l-pc5" d="M620 170 L620 235"/>
    <path id="l-srv" d="M620 170 L730 235"/>
    <!-- end-to-end paths for packets -->
    <path id="p1" d="M110 235 L220 170 L420 110 L420 48"/>
    <path id="p2" d="M420 48 L420 110 L620 170 L730 235"/>
    <path id="p3" d="M330 235 L220 170 L420 110 L620 170 L510 235"/>
    <path id="p4" d="M620 235 L620 170 L420 110 L220 170 L220 235"/>
  </defs>

  <rect width="840" height="280" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="839" height="279" rx="14" fill="none" stroke="#30363d"/>

  <!-- VLAN zones -->
  <rect x="70" y="150" width="300" height="115" rx="10" fill="#1f6feb" fill-opacity="0.07" stroke="#1f6feb" stroke-opacity="0.35" stroke-dasharray="4 4"/>
  <text x="82" y="258" fill="#58a6ff" font-size="11" opacity="0.8">VLAN 10 · Users</text>
  <rect x="470" y="150" width="300" height="115" rx="10" fill="#2ea043" fill-opacity="0.07" stroke="#2ea043" stroke-opacity="0.35" stroke-dasharray="4 4"/>
  <text x="482" y="258" fill="#3fb950" font-size="11" opacity="0.8">VLAN 20 · Servers</text>

  <!-- links -->
  <g stroke="#30363d" stroke-width="2.5" fill="none">
    <use href="#l-sw1"/><use href="#l-sw2"/>
    <use href="#l-pc1"/><use href="#l-pc2"/><use href="#l-pc3"/>
    <use href="#l-pc4"/><use href="#l-pc5"/><use href="#l-srv"/>
  </g>
  <use href="#l-inet" stroke="#30363d" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
  <!-- trunk links highlighted -->
  <g stroke="#58a6ff" stroke-width="2.5" fill="none" stroke-dasharray="10 190" opacity="0.8">
    <use href="#l-sw1"><animate attributeName="stroke-dashoffset" from="200" to="0" dur="2.4s" repeatCount="indefinite"/></use>
    <use href="#l-sw2"><animate attributeName="stroke-dashoffset" from="200" to="0" dur="2.4s" repeatCount="indefinite"/></use>
  </g>

  <!-- Internet cloud -->
  <g transform="translate(420 34)">
    <ellipse cx="0" cy="0" rx="46" ry="18" fill="#161b22" stroke="#8b949e"/>
    <text x="0" y="4" fill="#c9d1d9" font-size="12" text-anchor="middle">Internet</text>
  </g>
  <text x="438" y="84" fill="#8b949e" font-size="10">NAT · BGP</text>

  <!-- Router -->
  <g transform="translate(420 110)">
    <circle r="22" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <circle r="22" fill="none" stroke="#f0883e" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="22;34;22" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M-10 -4 L10 -4 M6 -8 L10 -4 L6 0 M10 4 L-10 4 M-6 0 L-10 4 L-6 8" stroke="#f0883e" stroke-width="2" fill="none"/>
    <text x="32" y="-6" fill="#f0883e" font-size="11">R1 · OSPF</text>
  </g>

  <!-- Switches -->
  <g font-size="11">
    <g transform="translate(220 170)">
      <rect x="-26" y="-13" width="52" height="26" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <g fill="#58a6ff"><circle cx="-14" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/></circle><circle cx="-5" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite"/></circle><circle cx="4" r="2.5"><animate attributeName="opacity" values="1;0.3;1" dur="0.7s" repeatCount="indefinite"/></circle><circle cx="13" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.1s" repeatCount="indefinite"/></circle></g>
      <text x="-60" y="-18" fill="#58a6ff">SW1 · STP</text>
    </g>
    <g transform="translate(620 170)">
      <rect x="-26" y="-13" width="52" height="26" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <g fill="#3fb950"><circle cx="-14" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/></circle><circle cx="-5" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></circle><circle cx="4" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></circle><circle cx="13" r="2.5"><animate attributeName="opacity" values="1;0.4;1" dur="0.6s" repeatCount="indefinite"/></circle></g>
      <text x="32" y="-18" fill="#3fb950">SW2 · ACL</text>
    </g>
  </g>

  <!-- Hosts -->
  <g fill="#161b22" stroke="#8b949e" stroke-width="1.5">
    <rect x="96" y="226" width="28" height="18" rx="3"/>
    <rect x="206" y="226" width="28" height="18" rx="3"/>
    <rect x="316" y="226" width="28" height="18" rx="3"/>
    <rect x="496" y="226" width="28" height="18" rx="3"/>
    <rect x="606" y="226" width="28" height="18" rx="3"/>
    <rect x="716" y="222" width="28" height="26" rx="3" stroke="#3fb950"/>
  </g>
  <g stroke="#3fb950" stroke-width="1.2"><line x1="721" y1="230" x2="739" y2="230"/><line x1="721" y1="236" x2="739" y2="236"/><line x1="721" y1="242" x2="739" y2="242"/></g>

  <!-- Packets -->
  <g filter="url(#glow)">
    <circle r="4.5" fill="#58a6ff"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4.5" fill="#f0883e"><animateMotion dur="3.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4" fill="#3fb950"><animateMotion dur="4.4s" begin="1.5s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4" fill="#d2a8ff"><animateMotion dur="4s" begin="2.2s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
  </g>

  <!-- terminal line -->
  <text x="22" y="28" fill="#8b949e" font-size="12">R1# <tspan fill="#3fb950">show ip ospf neighbor</tspan></text>
  <text x="22" y="46" fill="#8b949e" font-size="11">FULL/DR · <tspan fill="#c9d1d9">all links up</tspan>
    <animate attributeName="opacity" values="0;1;1;1" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="818" y="28" fill="#8b949e" font-size="11" text-anchor="end">ping 8.8.8.8 · <tspan fill="#3fb950">!!!!!</tspan></text>
</svg>
